name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project Python files
        run: |
          python -m compileall -q \
            projects/TissueTalk/app.py \
            projects/Medicinal-Plant-Bioprospecting/src/compound_descriptors.py
